name: Backend CI/CD - Build, push and deploy to ECS

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

# Finish the current deployment before another run can update the same service.
concurrency:
  group: shorturl-api-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 320080014524.dkr.ecr.ap-northeast-1.amazonaws.com
  ECR_REPOSITORY: shorturl-api
  ECS_CLUSTER: shorturl-demo
  ECS_SERVICE: shorturl-api
  ECS_CONTAINER_NAME: api
  # Each retry gets a new tag because this repository uses immutable tags.
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  CGO_ENABLED: "0"

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check Go code
        run: go vet ./...

      - name: Verify Go compilation
        run: go build ./...

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::320080014524:role/ShortUrlGithubEcrPush
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "320080014524"

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registries: "320080014524"

      - name: Push Docker image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          printf 'Published image: `%s/%s:%s`\n' \
            "$ECR_REGISTRY" "$ECR_REPOSITORY" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the service's current task definition
        run: |
          task_definition_arn="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text --no-cli-pager)"

          if [[ "$task_definition_arn" != arn:aws:ecs:ap-northeast-1:320080014524:task-definition/shorturl-api:* ]]; then
            echo "::error::The service did not return the expected shorturl-api task definition."
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$task_definition_arn" \
            --query 'taskDefinition' \
            --output json --no-cli-pager > "$RUNNER_TEMP/shorturl-task-definition.json"

      - name: Set the new container image
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1
        with:
          task-definition: ${{ runner.temp }}/shorturl-task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy to ECS and wait for stability
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          wait-max-delay-seconds: 15

      - name: Verify the deployed revision
        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0]' \
            --output json --no-cli-pager > "$RUNNER_TEMP/shorturl-deployed-service.json"

          # A rollback can restore stability while leaving the old version running.
          if ! jq -e --arg expected "$EXPECTED_TASK_DEFINITION" '
            .status == "ACTIVE" and
            .taskDefinition == $expected and
            .desiredCount > 0 and
            .runningCount == .desiredCount and
            .pendingCount == 0 and
            any(.deployments[];
              .status == "PRIMARY" and
              .taskDefinition == $expected and
              .rolloutState == "COMPLETED")
          ' "$RUNNER_TEMP/shorturl-deployed-service.json" > /dev/null; then
            echo "::error::ECS did not finish deploying the expected revision; check for a rollback or unhealthy tasks."
            exit 1
          fi

          printf 'Deployed task definition: `%s`\n' \
            "$EXPECTED_TASK_DEFINITION" >> "$GITHUB_STEP_SUMMARY"
